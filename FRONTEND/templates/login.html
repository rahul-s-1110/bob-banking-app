{% extends "base.html" %}

{% block title %}Login — SecureBank{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card p-4">
      <h4 class="card-title text-center mb-4">Welcome to SecureBank</h4>
      <form method="POST" action="{{ url_for('login') }}" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            required
            autocomplete="username"
            placeholder="Enter your username"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          />
        </div>
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
    </div>
    <p class="text-center text-muted mt-3" style="font-size:.85rem;">
      Demo credentials: <strong>customer</strong> / <strong>password123</strong>
    </p>
  </div>
</div>
{% endblock %}
