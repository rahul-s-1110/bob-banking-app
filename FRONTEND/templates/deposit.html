{% extends "base.html" %}

{% block title %}Deposit — SecureBank{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card p-4">
      <h4 class="card-title mb-4">Deposit Funds</h4>
      <form method="POST" action="{{ url_for('deposit') }}" novalidate>
        <div class="mb-3">
          <label for="amount" class="form-label">Amount (USD)</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input
              type="number"
              class="form-control"
              id="amount"
              name="amount"
              min="0.01"
              step="0.01"
              placeholder="0.00"
              required
            />
          </div>
          <div class="form-text">Enter a positive amount to deposit.</div>
        </div>
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-success">Confirm Deposit</button>
        </div>
      </form>
    </div>
    <div class="text-center mt-3">
      <a href="{{ url_for('dashboard') }}" class="text-muted">← Back to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
